<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaAI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f8fb;
  color: #17212b;
}

header {
  background: #0b6b68;
  color: white;
  padding: 25px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
}

.container {
  max-width: 800px;
  margin: 30px auto;
  padding: 20px;
}

.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}

input {
  flex: 1;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

button {
  padding: 14px 20px;
  border: none;
  border-radius: 8px;
  background: #0b6b68;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
  margin-bottom: 20px;
}

.card h2 {
  color: #0b6b68;
  margin-top: 0;
}

.card h3 {
  margin-bottom: 5px;
}

ul {
  padding-left: 20px;
}

.warning {
  background: #fff4d6;
  padding: 15px;
  border-radius: 8px;
  font-size: 14px;
  margin-top: 20px;
}

#result {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>💊 PharmaAI</h1>
  <p>Pharmacology learning simulator for medical students</p>
</header>

<div class="container">

  <div class="search-box">
    <input
      type="text"
      id="drugSearch"
      placeholder="Search a drug e.g. Paracetamol"
    >
    <button onclick="searchDrug()">Search</button>
  </div>

  <div id="result"></div>

  <div class="warning">
    ⚠️ <strong>Educational use only.</strong><br>
    This tool is for pharmacology learning and should not be used as a substitute
    for prescribing information or professional medical advice.
  </div>

</div>

<script>

let drugs = [];

/* Load drug database */
fetch("drugs.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("Could not load drug database");
    }
    return response.json();
  })
  .then(data => {
    drugs = data;
    console.log("Drug database loaded:", drugs.length);
  })
  .catch(error => {
    console.error(error);
  });


function searchDrug() {

  const searchText =
    document.getElementById("drugSearch").value.trim().toLowerCase();

  const result =
    document.getElementById("result");

  if (!searchText) {
    result.style.display = "block";
    result.innerHTML = "<div class='card'>Please enter a drug name.</div>";
    return;
  }

  const drug = drugs.find(
    d => d.name.toLowerCase() === searchText
  );

  if (!drug) {
    result.style.display = "block";
    result.innerHTML = `
      <div class="card">
        <h2>Drug not found</h2>
        <p>Try searching for Paracetamol, Amoxicillin, or Metformin.</p>
      </div>
    `;
    return;
  }

  result.style.display = "block";

  result.innerHTML = `

    <div class="card">

      <h2>${drug.name}</h2>

      <h3>Drug class</h3>
      <p>${drug.class}</p>

      <h3>When is it given?</h3>
      <ul>
        ${drug.uses.map(item => `<li>${item}</li>`).join("")}
      </ul>

      <h3>Route</h3>
      <ul>
        ${drug.routes.map(item => `<li>${item}</li>`).join("")}
      </ul>

      <h3>Contraindications / major cautions</h3>
      <ul>
        ${drug.contraindications.map(item => `<li>${item}</li>`).join("")}
      </ul>

      <h3>Adverse effects</h3>
      <ul>
        ${drug.adverseEffects.map(item => `<li>${item}</li>`).join("")}
      </ul>

      <h3>Monitoring</h3>
      <ul>
        ${drug.monitoring.map(item => `<li>${item}</li>`).join("")}
      </ul>

      <p>
        <strong>Source:</strong> ${drug.source}
      </p>

    </div>

  `;
}


/* Allow pressing Enter to search */
document
  .getElementById("drugSearch")
  .addEventListener("keypress", function(event) {

    if (event.key === "Enter") {
      searchDrug();
    }

  });

</script>

</body>
</html>

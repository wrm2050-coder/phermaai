<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaAI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f8fb;
  color: #17212b;
}

header {
  background: #0b6b68;
  color: white;
  padding: 28px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin: 8px 0 0;
}

.container {
  max-width: 850px;
  margin: 30px auto;
  padding: 20px;
}

.search-card {
  background: white;
  padding: 22px;
  border-radius: 14px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.08);
  margin-bottom: 25px;
}

.search-box {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 15px;
  border: 1px solid #ccd6dd;
  border-radius: 9px;
  font-size: 17px;
}

button {
  padding: 15px 22px;
  border: none;
  border-radius: 9px;
  background: #0b6b68;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.card h2 {
  color: #0b6b68;
  margin-top: 0;
  font-size: 29px;
}

.section {
  margin-top: 24px;
}

.section h3 {
  margin-bottom: 8px;
  color: #34495e;
  font-size: 19px;
}

.section p {
  line-height: 1.6;
}

ul {
  padding-left: 22px;
  line-height: 1.7;
}

.source {
  margin-top: 25px;
  padding-top: 15px;
  border-top: 1px solid #ddd;
  font-size: 14px;
  color: #555;
}

.warning {
  margin-top: 20px;
  background: #fff4d6;
  padding: 16px;
  border-radius: 9px;
  font-size: 14px;
  line-height: 1.5;
}

.not-found {
  text-align: center;
  padding: 25px;
}

@media (max-width: 600px) {

  .search-box {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

  .container {
    padding: 12px;
  }

  .card {
    padding: 20px;
  }
}
</style>
</head>

<body>

<header>
  <h1>💊 PharmaAI</h1>
  <p>Pharmacology learning simulator for medical students</p>
</header>

<div class="container">

  <div class="search-card">

    <div class="search-box">

      <input
        type="text"
        id="drugSearch"
        placeholder="Search drug e.g. Paracetamol"
      >

      <button onclick="searchDrug()">
        Search Drug
      </button>

    </div>

  </div>

  <div id="result"></div>

  <div class="warning">

    ⚠️ <strong>Educational use only.</strong><br>

    This tool is intended for pharmacology learning.
    It is not a substitute for official prescribing information,
    clinical guidelines, or professional medical advice.

  </div>

</div>

<script>

let drugs = [];


/* Load database */

fetch("drugs.json")

  .then(response => {

    if (!response.ok) {
      throw new Error("Database could not be loaded");
    }

    return response.json();

  })

  .then(data => {

    drugs = data;

    console.log("Loaded drugs:", drugs.length);

  })

  .catch(error => {

    console.error(error);

  });


/* Search drug */

function searchDrug() {

  const searchText =
    document
      .getElementById("drugSearch")
      .value
      .trim()
      .toLowerCase();

  const result =
    document.getElementById("result");


  if (!searchText) {

    result.innerHTML = `
      <div class="card not-found">
        <h2>Search for a drug</h2>
        <p>Enter a generic drug name above.</p>
      </div>
    `;

    return;

  }


  const drug = drugs.find(

    d => d.name.toLowerCase() === searchText

  );


  if (!drug) {

    result.innerHTML = `
      <div class="card not-found">

        <h2>Drug not found</h2>

        <p>
          Try one of the available drugs:
        </p>

        <p>
          Paracetamol • Ibuprofen • Amoxicillin •
          Azithromycin • Ceftriaxone • Metformin •
          Insulin • Furosemide • Omeprazole • Salbutamol
        </p>

      </div>
    `;

    return;

  }


  result.innerHTML = `

    <div class="card">

      <h2>${drug.name}</h2>


      <div class="section">

        <h3>💊 Drug class</h3>

        <p>${drug.class}</p>

      </div>


      <div class="section">

        <h3>🧬 Mechanism of action</h3>

        <p>${drug.mechanism}</p>

      </div>


      <div class="section">

        <h3>🎯 Indications / uses</h3>

        <ul>

          ${drug.uses
            .map(item => `<li>${item}</li>`)
            .join("")}

        </ul>

      </div>


      <div class="section">

        <h3>💉 Routes</h3>

        <ul>

          ${drug.routes
            .map(item => `<li>${item}</li>`)
            .join("")}

        </ul>

      </div>${drug.dosage ? `

<div class="section">

  <h3>💊 Dosage & Administration</h3>

  <h4>Adult</h4>
  <ul>
    ${drug.dosage.adult.map(item => `
      <li>
        <strong>${item.indication}</strong><br>
        Dose: ${item.dose}<br>
        Maximum: ${item.maximum}
      </li>
    `).join("")}
  </ul>

  <h4>Pediatric</h4>
  <ul>
    ${drug.dosage.pediatric.map(item => `
      <li>
        <strong>${item.indication}</strong><br>
        Dose: ${item.dose}<br>
        Maximum: ${item.maximum}
      </li>
    `).join("")}
  </ul>

  <h4>Duration</h4>
  <ul>
    ${drug.dosage.duration.map(item => `<li>${item}</li>`).join("")}
  </ul>

  <h4>Renal adjustment</h4>
  <p>${drug.dosage.renalAdjustment}</p>

  <h4>Hepatic adjustment</h4>
  <p>${drug.dosage.hepaticAdjustment}</p>

  <p class="source">
    📚 <strong>Dosing reference:</strong>
    ${drug.dosage.reference}
  </p>

</div>

` : ""}


      <div class="section">

        <h3>⚠️ Contraindications / major cautions</h3>

        <ul>

          ${drug.contraindications
            .map(item => `<li>${item}</li>`)
            .join("")}

        </ul>

      </div>


      <div class="section">

        <h3>🚨 Adverse effects</h3>

        <ul>

          ${drug.adverseEffects
            .map(item => `<li>${item}</li>`)
            .join("")}

        </ul>

      </div>


      <div class="section">

        <h3>🔄 Drug interactions</h3>

        <ul>

          ${drug.interactions
            .map(item => `<li>${item}</li>`)
            .join("")}

        </ul>

      </div>


      <div class="section">

        <h3>🧪 Monitoring</h3>

        <ul>

          ${drug.monitoring
            .map(item => `<li>${item}</li>`)
            .join("")}

        </ul>

      </div>


      <div class="source">

        📚 <strong>Reference:</strong>
        ${drug.source}

      </div>

    </div>

  `;

}


/* Enter key search */

document
  .getElementById("drugSearch")
  .addEventListener("keypress", function(event) {

    if (event.key === "Enter") {

      searchDrug();

    }

  });

</script>

</body>
</html>

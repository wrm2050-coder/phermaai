<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PharmaAI</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f8f9;
  color:#17343a;
}

header{
  background:linear-gradient(135deg,#008f83,#006f68);
  color:white;
  padding:28px 20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:32px;
}

header p{
  margin:8px 0 0;
  opacity:.9;
}

.container{
  max-width:850px;
  margin:auto;
  padding:20px;
}

.search-card{
  background:white;
  padding:18px;
  border-radius:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.search-box{
  display:flex;
  gap:10px;
}

.search-box input{
  flex:1;
  padding:14px;
  border:1px solid #ccdfe2;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

.search-box input:focus{
  border-color:#008f83;
}

.search-box button{
  background:#008f83;
  color:white;
  border:none;
  border-radius:10px;
  padding:0 20px;
  font-size:15px;
  cursor:pointer;
}

.search-box button:disabled{
  opacity:.6;
}

.hint{
  margin-top:10px;
  color:#6d8185;
  font-size:13px;
}

.card{
  background:white;
  margin-top:20px;
  padding:22px;
  border-radius:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.card h2{
  color:#007d73;
  margin-top:0;
}

.section{
  border-top:1px solid #e5eeee;
  padding:18px 0;
}

.section h3{
  margin:0 0 8px;
  color:#007d73;
  font-size:17px;
}

.section p{
  line-height:1.6;
  margin:0;
}

.section ul{
  margin:8px 0 0;
  padding-left:20px;
}

.section li{
  margin:7px 0;
  line-height:1.5;
}

.dose-box{
  background:#f2faf9;
  border:1px solid #d7ece9;
  border-radius:12px;
  padding:16px;
}

.dose-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:15px;
}

.dose-controls label{
  font-size:13px;
  font-weight:bold;
  color:#426166;
  display:block;
  margin-bottom:6px;
}

.dose-controls select{
  width:100%;
  padding:11px;
  border:1px solid #cbdfe1;
  border-radius:8px;
  background:white;
  font-size:14px;
}

.dose-result{
  background:white;
  border-radius:10px;
  padding:14px;
  border:1px solid #dfeceb;
}

.dose-result strong{
  color:#007d73;
}

.source{
  background:#edf7f7;
  padding:12px;
  border-radius:9px;
  font-size:13px;
  color:#486267;
  line-height:1.5;
}

.warning{
  margin-top:20px;
  background:#fff8e6;
  border-left:4px solid #e6a700;
  padding:15px;
  border-radius:8px;
  line-height:1.5;
  font-size:13px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#547075;
}

.not-found{
  text-align:center;
}

.badge{
  display:inline-block;
  background:#e8f5f4;
  color:#007d73;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:12px;
}

.external-link{
  display:inline-block;
  margin-top:10px;
  background:#008f83;
  color:white;
  padding:9px 12px;
  border-radius:8px;
  text-decoration:none;
  font-size:13px;
}

.small-note{
  color:#687b7f;
  font-size:13px;
  line-height:1.5;
}

.fda-dose{
  background:#f8fbfb;
  border:1px solid #e0ebeb;
  border-radius:10px;
  padding:14px;
  line-height:1.6;
  margin-top:8px;
}

@media(max-width:600px){

  .container{
    padding:14px;
  }

  .search-box{
    flex-direction:column;
  }

  .search-box button{
    padding:13px;
  }

  .dose-controls{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:28px;
  }

}

</style>

</head>


<body>


<header>

  <h1>💊 PharmaAI</h1>

  <p>
    Pharmacology learning simulator for medical students
  </p>

</header>


<div class="container">


  <div class="search-card">

    <div class="search-box">

      <input
        type="text"
        id="drugSearch"
        placeholder="Search drug e.g. Paracetamol or Warfarin"
      >

      <button
        id="searchButton"
        onclick="searchDrug()"
      >
        Search Drug
      </button>

    </div>

    <div class="hint">
      Search by generic or brand name
    </div>

  </div>


  <div id="result"></div>


  <div class="warning">

    ⚠️ <strong>Educational use only.</strong><br>

    PharmaAI is intended for pharmacology learning.
    It is not a substitute for official prescribing information,
    clinical guidelines, or professional medical advice.

  </div>


</div>



<script>


/* =====================================================
   DATABASE
===================================================== */

let drugs = [];

let currentDrug = null;


/* =====================================================
   LOAD LOCAL DATABASE
===================================================== */

fetch("drugs.json")

.then(response => {

  if(!response.ok){

    throw new Error("Database could not be loaded");

  }

  return response.json();

})

.then(data => {

  drugs = data;

  console.log(
    "Loaded drugs:",
    drugs.length
  );

})

.catch(error => {

  console.error(error);

});



/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}



/* =====================================================
   CREATE BULLET LIST
===================================================== */

function makeList(items){

  if(
    !Array.isArray(items) ||
    items.length === 0
  ){

    return `
      <p class="small-note">
        Not available in this source.
      </p>
    `;

  }


  return `

    <ul>

      ${items.map(item =>

        `<li>${escapeHtml(item)}</li>`

      ).join("")}

    </ul>

  `;

}



/* =====================================================
   SEARCH
===================================================== */

async function searchDrug(){

  const input =
    document.getElementById("drugSearch");

  const result =
    document.getElementById("result");

  const button =
    document.getElementById("searchButton");


  const searchText =
    input.value.trim();


  if(!searchText){

    result.innerHTML = `

      <div class="card not-found">

        <h2>Search for a drug</h2>

        <p>
          Enter a drug name above.
        </p>

      </div>

    `;

    return;

  }


  /* ==============================================
     SEARCH LOCAL DATABASE FIRST
  ============================================== */

  const drug =
    drugs.find(d =>

      d.name &&
      d.name.toLowerCase() ===
      searchText.toLowerCase()

    );


  if(drug){

    currentDrug = drug;

    displayLocalDrug(drug);

    return;

  }


  /* ==============================================
     SEARCH FDA
  ============================================== */

  result.innerHTML = `

    <div class="card loading">

      🔎 Searching FDA drug labeling...

    </div>

  `;


  button.disabled = true;


  try{

    const response =
      await fetch(
        "/api/drug?drug=" +
        encodeURIComponent(searchText)
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.message ||
        data.error ||
        "Drug lookup failed"
      );

    }


    displayFDADrug(data);

  }

  catch(error){

    console.error(error);


    result.innerHTML = `

      <div class="card not-found">

        <h2>Drug not found</h2>

        <p>
          No matching drug information was found.
        </p>

        <p class="small-note">

          Try searching using the generic name.

        </p>

      </div>

    `;

  }

  finally{

    button.disabled = false;

  }

}



/* =====================================================
   LOCAL DRUG DISPLAY
===================================================== */

function displayLocalDrug(drug){

  const result =
    document.getElementById("result");


  result.innerHTML = `

    <div class="card">

      <h2>
        ${escapeHtml(drug.name)}
      </h2>


      <div class="section">

        <h3>💊 Drug class</h3>

        <p>
          ${escapeHtml(drug.class)}
        </p>

      </div>


      <div class="section">

        <h3>🧬 Mechanism of action</h3>

        <p>
          ${escapeHtml(drug.mechanism)}
        </p>

      </div>


      <div class="section">

        <h3>🎯 Indications</h3>

        ${makeList(drug.uses)}

      </div>


      <div class="section">

        <h3>💉 Routes of administration</h3>

        ${makeList(drug.routes)}

      </div>


      <div class="section">

        <h3>💊 Dosage & Administration</h3>

        <div class="dose-box">

          <div class="dose-controls">


            <div>

              <label>
                Patient group
              </label>

              <select
                id="patientGroup"
                onchange="updateDoseResult()"
              >

                <option value="adult">
                  Adult
                </option>

                <option value="pediatric">
                  Pediatric
                </option>

              </select>

            </div>


            <div>

              <label>
                Indication
              </label>

              <select
                id="doseIndication"
                onchange="updateDoseResult()"
              ></select>

            </div>


          </div>


          <div
            id="doseResult"
            class="dose-result"
          ></div>

        </div>

      </div>


      <div class="section">

        <h3>🚫 Contraindications</h3>

        ${makeList(drug.contraindications)}

      </div>


      <div class="section">

        <h3>⚠️ Adverse effects</h3>

        ${makeList(drug.adverseEffects)}

      </div>


      <div class="section">

        <h3>🔄 Drug interactions</h3>

        ${makeList(drug.interactions)}

      </div>


      <div class="section">

        <h3>🩺 Monitoring</h3>

        ${makeList(drug.monitoring)}

      </div>


      <div class="source">

        <strong>Source:</strong>

        ${escapeHtml(
          drug.dosage?.reference ||
          drug.source ||
          "Curated reference"
        )}

      </div>

    </div>

  `;


  populateDoseIndications();

}



/* =====================================================
   DOSAGE DROPDOWN
===================================================== */

function populateDoseIndications(){

  if(
    !currentDrug ||
    !currentDrug.dosage
  ){

    return;

  }


  const group =
    document.getElementById(
      "patientGroup"
    ).value;


  const select =
    document.getElementById(
      "doseIndication"
    );


  const doses =
    currentDrug.dosage[group] || [];


  select.innerHTML = "";


  if(doses.length === 0){

    select.innerHTML = `

      <option>
        No structured dose available
      </option>

    `;

    updateDoseResult();

    return;

  }


  doses.forEach(
    (dose,index) => {

      const option =
        document.createElement(
          "option"
        );


      option.value = index;


      option.textContent =
        dose.indication ||
        "Dose";


      select.appendChild(
        option
      );

    }
  );


  updateDoseResult();

}



/* =====================================================
   SHOW SELECTED DOSE
===================================================== */

function updateDoseResult(){

  if(
    !currentDrug ||
    !currentDrug.dosage
  ){

    return;

  }


  const group =
    document.getElementById(
      "patientGroup"
    ).value;


  const select =
    document.getElementById(
      "doseIndication"
    );


  const output =
    document.getElementById(
      "doseResult"
    );


  const doses =
    currentDrug.dosage[group] || [];


  if(doses.length === 0){

    output.innerHTML = `

      <p>
        No structured dose available.
      </p>

    `;

    return;

  }


  const index =
    parseInt(select.value || 0);


  const dose =
    doses[index];


  if(!dose){

    return;

  }


  output.innerHTML = `

    <p>

      <strong>Dose:</strong><br>

      ${escapeHtml(
        dose.dose ||
        "Not specified"
      )}

    </p>


    ${
      dose.maximum

      ?

      `

      <p>

        <strong>Maximum:</strong><br>

        ${escapeHtml(
          dose.maximum
        )}

      </p>

      `

      :

      ""

    }


    ${
      dose.duration

      ?

      `

      <p>

        <strong>Duration:</strong><br>

        ${escapeHtml(
          dose.duration
        )}

      </p>

      `

      :

      ""

    }


    ${
      currentDrug.dosage.renalAdjustment

      ?

      `

      <p>

        <strong>Renal adjustment:</strong><br>

        ${escapeHtml(
          currentDrug.dosage
            .renalAdjustment
        )}

      </p>

      `

      :

      ""

    }


    ${
      currentDrug.dosage.hepaticAdjustment

      ?

      `

      <p>

        <strong>Hepatic adjustment:</strong><br>

        ${escapeHtml(
          currentDrug.dosage
            .hepaticAdjustment
        )}

      </p>

      `

      :

      ""

    }

  `;

}



/* =====================================================
   FDA DRUG DISPLAY
===================================================== */

function displayFDADrug(data){

  const result =
    document.getElementById(
      "result"
    );


  result.innerHTML = `

    <div class="card">


      <span class="badge">
        FDA Label Data
      </span>


      <h2>

        ${escapeHtml(
          data.genericName ||
          data.searchTerm
        )}

      </h2>


      ${
        data.brandName

        ?

        `<p class="small-note">
          Brand:
          ${escapeHtml(data.brandName)}
        </p>`

        :

        ""

      }


      ${
        data.manufacturer

        ?

        `<p class="small-note">
          Manufacturer:
          ${escapeHtml(data.manufacturer)}
        </p>`

        :

        ""

      }


      <!-- MECHANISM -->

      ${
        data.mechanism?.length

        ?

        `

        <div class="section">

          <h3>
            🧬 Mechanism of action
          </h3>

          ${makeList(data.mechanism)}

        </div>

        `

        :

        ""

      }


      <!-- INDICATIONS -->

      ${
        data.indications?.length

        ?

        `

        <div class="section">

          <h3>
            🎯 Indications
          </h3>

          ${makeList(data.indications)}

        </div>

        `

        :

        ""

      }


      <!-- ROUTES -->

      ${
        data.route?.length

        ?

        `

        <div class="section">

          <h3>
            💉 Routes of administration
          </h3>

          ${makeList(data.route)}

        </div>

        `

        :

        ""

      }


      <!-- DOSAGE -->

      ${
        data.dosage?.length

        ?

        `

        <div class="section">

          <h3>
            💊 Dosage & Administration
          </h3>


          <div class="dose-box">

            ${data.dosage.map(item => `

              <div class="fda-dose">

                ${escapeHtml(item)}

              </div>

            `).join("")}

          </div>

        </div>

        `

        :

        ""

      }


      <!-- DOSAGE FORMS -->

      ${
        data.dosageForms?.length

        ?

        `

        <div class="section">

          <h3>
            💊 Dosage forms & strengths
          </h3>

          ${makeList(data.dosageForms)}

        </div>

        `

        :

        ""

      }


      <!-- CONTRAINDICATIONS -->

      ${
        data.contraindications?.length

        ?

        `

        <div class="section">

          <h3>
            🚫 Contraindications
          </h3>

          ${makeList(
            data.contraindications
          )}

        </div>

        `

        :

        ""

      }


      <!-- ADVERSE EFFECTS -->

      ${
        data.adverseEffects?.length

        ?

        `

        <div class="section">

          <h3>
            ⚠️ Adverse effects
          </h3>

          ${makeList(
            data.adverseEffects
          )}

        </div>

        `

        :

        ""

      }


      <!-- INTERACTIONS -->

      ${
        data.interactions?.length

        ?

        `

        <div class="section">

          <h3>
            🔄 Drug interactions
          </h3>

          ${makeList(
            data.interactions
          )}

        </div>

        `

        :

        ""

      }


      <!-- WARNINGS -->

      ${
        data.warnings?.length

        ?

        `

        <div class="section">

          <h3>
            ⚠️ Warnings & precautions
          </h3>

          ${makeList(
            data.warnings
          )}

        </div>

        `

        :

        ""

      }


      <!-- MONITORING -->

      ${
        data.monitoring?.length

        ?

        `

        <div class="section">

          <h3>
            🩺 Monitoring / laboratory tests
          </h3>

          ${makeList(
            data.monitoring
          )}

        </div>

        `

        :

        ""

      }


      <!-- OFFICIAL LABEL -->

      <div class="section">

        <h3>
          📄 Official information
        </h3>

        <p class="small-note">

          This information is derived from
          FDA labeling. Check the current
          official label for the complete
          product-specific information.

        </p>


        ${
          data.labelURL

          ?

          `

          <a
            class="external-link"
            href="${escapeHtml(
              data.labelURL
            )}"
            target="_blank"
            rel="noopener noreferrer"
          >

            View official label ↗

          </a>

          `

          :

          ""

        }

      </div>


      <div class="source">

        <strong>Source:</strong>
        FDA openFDA drug labeling.

        ${
          data.effectiveTime

          ?

          `<br>
          Label effective date:
          ${escapeHtml(
            data.effectiveTime
          )}`

          :

          ""

        }

        <br><br>

        ⚠️ FDA label data is product-specific
        and is provided here for educational use.
        Verify the current official label and
        applicable clinical guidelines.

      </div>


    </div>

  `;

}



/* =====================================================
   ENTER KEY
===================================================== */

document
  .getElementById("drugSearch")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        searchDrug();

      }

    }
  );


</script>


</body>
</html>
